# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# https://developer.android.com/studio/build/build-analytics

# Specifies the JVM arguments used for the Gradle Daemon.
# Increasing heap space to fix OutOfMemoryError during DEX merging (mergeExtDexDebug)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enables parallel execution of build tasks
org.gradle.parallel=true

# Enables build caching for faster builds
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true
android.nonTransitiveRClass=true
