# Project-wide Gradle settings.
# IDE (e.g. Android Studio) uses these settings for sync and build.

# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true

# Enables parallel execution of tasks
org.gradle.parallel=true

# Enables caching of task outputs
org.gradle.caching=true

# Enables non-transitive R classes to reduce app build sizes
android.nonTransitiveAppRClass=true
